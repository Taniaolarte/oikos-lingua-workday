<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oikos Lingua · Workday</title>
<meta name="description" content="Practise the language you actually use at work. Short workplace situations in English and French, for working adults.">
<meta name="theme-color" content="#1F3A56">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot" class="wrap" style="padding:80px 20px;text-align:center;color:var(--ink-3)">
  <p>Setting up your workday…</p>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <button class="brand" id="brand" aria-label="Oikos Lingua home">
        <img src="img/owl-navy.png" width="38" height="38" alt="">
        <span class="brand-txt"><b>OIKOS LINGUA</b><span>Workday</span></span>
      </button>
      <div class="top-sp"></div>
      <span class="jobtag" id="jobtag" hidden></span>
      <nav class="top-nav" id="nav" hidden>
        <button class="tbtn" data-go="home">Workday</button>
        <button class="tbtn" data-go="activities">Activities</button>
        <button class="tbtn" data-go="library">Guides</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="screen" id="sc-onboard"></section>
    <section class="screen" id="sc-home"></section>
    <section class="screen" id="sc-challenge"></section>
    <section class="screen" id="sc-results"></section>
    <section class="screen" id="sc-activities"></section>
    <section class="screen" id="sc-library"></section>
    <section class="screen" id="sc-guide"></section>
  </main>

  <footer class="foot">
    <div class="wrap">
      Oikos Lingua · Workday. Language practice built around the working day.
    </div>
  </footer>
</div>

<script src="js/avatars.js"></script>
<script src="js/spanish.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
